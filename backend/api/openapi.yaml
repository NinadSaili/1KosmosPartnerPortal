openapi: 3.1.0

info:
  title: 1Kosmos Partner Portal API
  version: 1.0.0
  description: REST API for the 1Kosmos Partner Enablement Portal
  contact:
    email: api@1kosmos.com

servers:
  - url: /api/v1
    description: Relative base path (same origin)
  - url: https://api.partnerportal.1kosmos.com/api/v1
    description: Production server

security:
  - BearerAuth: []

# ---------------------------------------------------------------------------
# TAGS
# ---------------------------------------------------------------------------
tags:
  - name: Auth
    description: Authentication — no credentials required
  - name: Users
    description: User management
  - name: Organizations
    description: Partner organization management
  - name: Onboarding
    description: Org onboarding checklist
  - name: Dashboard
    description: Summary statistics and team progress
  - name: Courses
    description: Training course catalog
  - name: Lessons
    description: Lessons nested under courses
  - name: Progress
    description: Per-user course progress tracking
  - name: Certifications
    description: Certification program definitions
  - name: Assessments
    description: Assessment scheduling
  - name: Certificates
    description: Issued certificates (PDF download)
  - name: Resources
    description: Sales & technical resource library
  - name: Deals
    description: Deal registration
  - name: Announcements
    description: Platform announcements
  - name: AI
    description: AI query assistant
  - name: Admin
    description: Vendor-admin provisioning and audit log
  - name: Health
    description: Service health check

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:

  # =========================================================================
  # AUTH
  # =========================================================================

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive tokens
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/magic-link:
    post:
      tags: [Auth]
      summary: Send a magic-link sign-in email
      operationId: authMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@partner.com
      responses:
        '200':
          description: Magic link sent (always 200 to avoid enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If that address is registered, a magic link has been sent.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using a refresh token
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # USERS
  # =========================================================================

  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Users]
      summary: Get a single user by ID
      operationId: getUserById
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Users]
      summary: Update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # ORGANIZATIONS
  # =========================================================================

  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations (paginated)
      operationId: listOrganizations
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Organizations]
      summary: Create a new organization
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Organizations]
      summary: Get an organization by ID
      operationId: getOrganizationById
      responses:
        '200':
          description: Organization object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Organizations]
      summary: Update an organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # ONBOARDING
  # =========================================================================

  /onboarding/{orgId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Onboarding]
      summary: Get onboarding checklist for an organization
      operationId: getOnboardingChecklist
      responses:
        '200':
          description: Onboarding checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingChecklist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Onboarding]
      summary: Update onboarding checklist items
      operationId: updateOnboardingChecklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistRequest'
      responses:
        '200':
          description: Updated checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingChecklist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # DASHBOARD
  # =========================================================================

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get aggregated dashboard statistics for the caller's org
      operationId: getDashboardStats
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dashboard/team-progress:
    get:
      tags: [Dashboard]
      summary: Get per-member training progress for the caller's team
      operationId: getTeamProgress
      responses:
        '200':
          description: Array of team member progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # COURSES
  # =========================================================================

  /courses:
    get:
      tags: [Courses]
      summary: List courses with optional filtering and pagination
      operationId: listCourses
      parameters:
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by tag slug
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/CourseLevel'
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search term
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated course list with per-caller progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCoursesWithProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Courses]
      summary: Create a new course (vendor_admin only)
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /courses/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Courses]
      summary: Get full course detail with lessons and per-lesson completion
      operationId: getCourseById
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Courses]
      summary: Update a course (vendor_admin only)
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Updated course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Courses]
      summary: Delete a course (vendor_admin only)
      operationId: deleteCourse
      responses:
        '204':
          description: Course deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # LESSONS
  # =========================================================================

  /courses/{courseId}/lessons:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Lessons]
      summary: List lessons for a course (includes isCompleted for caller)
      operationId: listLessons
      responses:
        '200':
          description: Ordered list of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonWithCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Lessons]
      summary: Add a lesson to a course (vendor_admin only)
      operationId: createLesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
      responses:
        '201':
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /courses/{courseId}/lessons/{id}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Lessons]
      summary: Update a lesson (vendor_admin only)
      operationId: updateLesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
      responses:
        '200':
          description: Updated lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Lessons]
      summary: Delete a lesson (vendor_admin only)
      operationId: deleteLesson
      responses:
        '204':
          description: Lesson deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # PROGRESS
  # =========================================================================

  /courses/{courseId}/progress/{userId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Progress]
      summary: Get a user's progress record for a specific course
      operationId: getCourseProgress
      responses:
        '200':
          description: Course progress record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /courses/{courseId}/progress/complete-lesson:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Progress]
      summary: Mark a lesson as complete for the calling user
      operationId: completeLessonProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson_id]
              properties:
                lesson_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Completion result with updated progress percentage
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed:
                    type: boolean
                    description: Whether the lesson was newly marked complete
                  course_complete:
                    type: boolean
                    description: Whether all lessons in the course are now complete
                  progress_pct:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 100
                    description: Updated overall course completion percentage
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # CERTIFICATIONS
  # =========================================================================

  /certifications:
    get:
      tags: [Certifications]
      summary: List all certifications with caller's eligibility status
      operationId: listCertifications
      responses:
        '200':
          description: Certifications with eligibility
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificationWithEligibility'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Certifications]
      summary: Create a certification program (vendor_admin only)
      operationId: createCertification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificationRequest'
      responses:
        '201':
          description: Certification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /certifications/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Certifications]
      summary: Get detailed certification information
      operationId: getCertificationById
      responses:
        '200':
          description: Certification detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Certifications]
      summary: Update a certification program (vendor_admin only)
      operationId: updateCertification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCertificationRequest'
      responses:
        '200':
          description: Updated certification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # ASSESSMENTS
  # =========================================================================

  /assessments:
    get:
      tags: [Assessments]
      summary: List assessment schedules
      operationId: listAssessments
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssessmentStatus'
      responses:
        '200':
          description: List of assessment schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Assessments]
      summary: Schedule an assessment
      operationId: scheduleAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleAssessmentRequest'
      responses:
        '201':
