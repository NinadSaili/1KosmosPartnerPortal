          type: integer
          description: Total course completions across the org
          example: 47
        certifications_earned:
          type: integer
          example: 8
        deals_registered:
          type: integer
          example: 5
        deals_approved:
          type: integer
          example: 3
        deals_pipeline_value:
          type: number
          format: double
          description: Sum of estimated deal values in USD
          example: 450000.0
