# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------
components:

  # -------------------------------------------------------------------------
  # Security schemes
  # -------------------------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Provide a valid JWT access token obtained from /auth/login or
        /auth/refresh. Example: `Authorization: Bearer <token>`

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)

    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Malformed request syntax or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Bad Request
            message: Request body could not be parsed
            code: 400

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            message: Token is missing or expired
            code: 401

    Forbidden:
      description: Authenticated but insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
            message: You do not have permission to perform this action
            code: 403

    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Not Found
            message: The requested resource could not be found
            code: 404

    UnprocessableEntity:
      description: Validation failed on a syntactically valid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            error: Unprocessable Entity
            message: Validation failed
            code: 422
            details:
              - field: email
                message: must be a valid email address

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Too Many Requests
            message: Rate limit exceeded. Please retry after 60 seconds.
            code: 429

    InternalServerError:
      description: Unexpected server-side error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal Server Error
            message: An unexpected error occurred
            code: 500

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # -----------------------------------------------------------------------
    # Shared / primitive enums
    # -----------------------------------------------------------------------
    UserRole:
      type: string
      enum: [vendor_admin, partner_admin, partner_user]
      description: >
        vendor_admin — 1Kosmos internal administrator;
        partner_admin — manages their own organisation;
        partner_user — regular partner employee

    CourseLevel:
      type: string
      enum: [beginner, intermediate, advanced]

    ResourceType:
      type: string
      enum: [datasheet, whitepaper, video, presentation, case_study, guide, other]

    DealStatus:
      type: string
      enum: [draft, submitted, under_review, approved, rejected, won, lost]

    AnnouncementType:
      type: string
      enum: [product_update, event, promotion, general]

    AssessmentStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]

    PartnerTier:
      type: string
      enum: [registered, silver, gold, platinum]

    # -----------------------------------------------------------------------
    # Error schemas
    # -----------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error, message, code]
      properties:
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: The requested resource could not be found
        code:
          type: integer
          example: 404
        request_id:
          type: string
          description: Correlation ID for log tracing
          example: 01HZ9Q3BWEXAMPLE

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: must be a valid email address

    # -----------------------------------------------------------------------
    # Pagination wrapper
    # -----------------------------------------------------------------------
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 142
        totalPages:
          type: integer
          example: 8

    # -----------------------------------------------------------------------
    # Token pair
    # -----------------------------------------------------------------------
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived JWT for API authentication
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Long-lived token used to obtain new access tokens
          example: dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4...
        expires_in:
          type: integer
          description: Access token TTL in seconds
          example: 3600
        token_type:
          type: string
          enum: [Bearer]
          default: Bearer

    # -----------------------------------------------------------------------
    # User
    # -----------------------------------------------------------------------
    User:
      type: object
      required: [id, email, first_name, last_name, role, org_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        role:
          $ref: '#/components/schemas/UserRole'
        org_id:
          type: string
          format: uuid
        avatar_url:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          nullable: true
          example: +1-555-000-0000
        title:
