  /ai/query:
    post:
      tags: [AI]
      summary: Submit a question to the AI assistant; supports SSE streaming
      operationId: aiQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
      responses:
        '200':
          description: |
            AI response. When the `Accept` header is `text/event-stream`, the
            server streams Server-Sent Events with incremental answer chunks.
            Each SSE event has `data: <json chunk>`. A final `data: [DONE]`
            event signals the end of the stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIQueryResponse'
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream; each event is a JSON AIQueryChunk
                example: |
                  data: {"chunk":"Here","done":false}
                  data: {"chunk":" is","done":false}
                  data: [DONE]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
