        label:
          type: string
          example: NDA Signed
        completed:
          type: boolean
        completed_at:
          type: string
          format: date-time
          nullable: true
        completed_by:
          type: string
          format: uuid
          nullable: true
          description: ID of the user who completed this item

    OnboardingChecklist:
      type: object
      required: [org_id, items, overall_progress_pct, ready_to_deal_register]
      properties:
