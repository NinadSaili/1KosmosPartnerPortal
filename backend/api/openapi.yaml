          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingChecklistItem'
        overall_progress_pct:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of checklist items completed
          example: 66.7
        ready_to_deal_register:
          type: boolean
          description: >
            True when all prerequisite checklist items required before deal
            registration (e.g., NDA signed, training complete) are marked done.

