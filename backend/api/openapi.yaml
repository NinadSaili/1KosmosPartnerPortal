          type: string
          format: email
          nullable: true
        estimated_value_usd:
          type: number
          format: double
          minimum: 0
          nullable: true
        close_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true

    UpdateDealStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/DealStatus'
        notes:
          type: string
          nullable: true
          description: Optional reason or reviewer comment for the status change

    PaginatedDeals:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # -----------------------------------------------------------------------
    # Announcements
    # -----------------------------------------------------------------------
    Announcement:
      type: object
      required: [id, title, body, type, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: BlockID 5.0 Now Available
        body:
          type: string
          description: Rich-text (HTML/Markdown) body content
        type:
          $ref: '#/components/schemas/AnnouncementType'
        is_pinned:
          type: boolean
          default: false
          description: Pinned announcements appear at the top of the list
        publish_at:
          type: string
          format: date-time
          nullable: true
          description: Schedule announcement for future publishing; null = publish immediately
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnnouncementWithRead:
      allOf:
        - $ref: '#/components/schemas/Announcement'
        - type: object
          properties:
            is_read:
              type: boolean
              description: Whether the calling user has already read this announcement
            read_at:
              type: string
              format: date-time
              nullable: true

    CreateAnnouncementRequest:
      type: object
      required: [title, body, type]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
        type:
          $ref: '#/components/schemas/AnnouncementType'
        is_pinned:
          type: boolean
          default: false
        publish_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    UpdateAnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
        type:
          $ref: '#/components/schemas/AnnouncementType'
        is_pinned:
          type: boolean
        publish_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    PaginatedAnnouncementsWithRead:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnnouncementWithRead'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # -----------------------------------------------------------------------
    # AI
    # -----------------------------------------------------------------------
    AIQueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          example: How do I configure BlockID for SAML federation?
        context_resource_ids:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Optional list of resource UUIDs to use as additional context for
            the AI's retrieval-augmented generation.
        stream:
          type: boolean
          default: false
          description: >
            When true, caller should set Accept: text/event-stream to receive
            an SSE stream rather than a single JSON response.
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: >
            If provided, the AI maintains conversational context across multiple
            queries within the same session.

    AIQueryResponse:
      type: object
      required: [answer, conversation_id]
      properties:
        answer:
          type: string
          description: Full markdown-formatted answer from the AI
          example: To configure BlockID for SAML federation, first navigate to...
        conversation_id:
          type: string
          format: uuid
          description: >
            Conversation session ID; pass this in subsequent requests to
            continue the same conversation thread.
        source_resources:
          type: array
          description: Documents used by RAG to ground the answer
          items:
            type: object
            properties:
              resource_id:
                type: string
                format: uuid
              title:
                type: string
              relevance_score:
                type: number
                format: float
                minimum: 0
                maximum: 1
        tokens_used:
          type: integer
          description: Total LLM tokens consumed by this request
          example: 842

    AIQueryChunk:
      type: object
      description: Single SSE data chunk for streaming responses
      properties:
        chunk:
          type: string
          description: Incremental answer text fragment
          example: "To configure"
        done:
          type: boolean
          description: True on the final chunk; the full answer is now complete
          example: false

    # -----------------------------------------------------------------------
    # Admin
    # -----------------------------------------------------------------------
    ProvisionUserRequest:
      type: object
      required: [email, first_name, last_name, role, org_id]
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        org_id:
          type: string
          format: uuid
        phone:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        send_welcome_email:
          type: boolean
          default: true
          description: >
            When true, the provisioned user receives an email with a
            magic-link to set their password.

    AuditLog:
      type: object
      required: [id, actor_id, action, resource_type, resource_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          description: User who performed the action
        actor_email:
          type: string
          format: email
          readOnly: true
        action:
          type: string
          enum: [create, update, delete, login, logout, download, view, status_change]
          example: update
        resource_type:
          type: string
          enum: [user, organization, course, lesson, resource, deal, announcement, certificate, assessment]
        resource_id:
          type: string
          format: uuid
        diff:
          type: object
          nullable: true
          description: >
            JSON object representing before/after values for update actions.
            Sensitive fields (password_hash, tokens) are redacted.
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
          example: 203.0.113.42
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PaginatedAuditLog:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
